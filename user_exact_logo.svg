<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" width="100%" height="100%" style="background: transparent;">
  <defs>
    <style>
      /* Base Outline Stroke */
      .stitch-outline {
        stroke: #000000;
        stroke-width: 4.5;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      /* Capsule 1: Top-Left (8.2s total: ~2.4s draw/fill + ~5.5s still hold) */
      .capsule-1 {
        stroke-dasharray: 520;
        stroke-dashoffset: 520;
        animation: drawCapsule 8.2s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }

      /* Capsule 2: Bottom-Right */
      .capsule-2 {
        stroke-dasharray: 520;
        stroke-dashoffset: 520;
        animation: drawCapsule 8.2s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        animation-delay: 0.2s;
      }

      /* The White Central Stitch */
      .stitch-cut {
        stroke: #ffffff; /* পুরোপুরি সাদা */
        stroke-width: 7.5; /* থিকনেস বাড়ানো হয়েছে */
        stroke-linecap: round;
        stroke-dasharray: 55;
        stroke-dashoffset: 55;
        animation: drawStitch 8.2s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        animation-delay: 0.5s;
      }

      /* "CodeStitcher" Text */
      .logo-text {
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", "Helvetica Neue", sans-serif;
        font-size: 96px;
        font-weight: 600;
        letter-spacing: -2.5px;
        stroke: #000000;
        stroke-width: 2.2;
        stroke-dasharray: 600;
        stroke-dashoffset: 600;
        animation: drawText 8.2s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        animation-delay: 0.4s;
      }

      /* Reconstruction, Solid Fill & 5.5s Still Hold */
      @keyframes drawCapsule {
        0% {
          stroke-dashoffset: 520;
          fill: transparent;
        }
        14% {
          stroke-dashoffset: 0;
          fill: transparent;
        }
        22%, 94% {
          stroke-dashoffset: 0;
          fill: #000000;
        }
        100% {
          stroke-dashoffset: 0;
          fill: transparent;
        }
      }

      @keyframes drawStitch {
        0%, 8% {
          stroke-dashoffset: 55;
        }
        16%, 94% {
          stroke-dashoffset: 0;
        }
        100% {
          stroke-dashoffset: 0;
        }
      }

      @keyframes drawText {
        0% {
          stroke-dashoffset: 600;
          fill: transparent;
        }
        16% {
          stroke-dashoffset: 0;
          fill: transparent;
        }
        24%, 94% {
          stroke-dashoffset: 0;
          fill: #000000;
        }
        100% {
          stroke-dashoffset: 0;
          fill: transparent;
        }
      }
    </style>
  </defs>

  <!-- ================= 1. THE 'S-STITCH' MARK ================= -->
  <!-- Centered at X: 180, Y: 180 and rotated 45° -->
  <g id="icon-mark" transform="translate(180, 180) rotate(45)">
    <!-- Top-Left Capsule -->
    <rect class="stitch-outline capsule-1" 
          x="-72" y="-95" 
          width="66" height="150" 
          rx="33" />

    <!-- Bottom-Right Capsule -->
    <rect class="stitch-outline capsule-2" 
          x="6" y="-55" 
          width="66" height="150" 
          rx="33" />

    <!-- Pure White Stitch (Crosses over both black capsules across the gap) -->
    <line class="stitch-cut" 
          x1="-20" y1="0" 
          x2="20" y2="0" />
  </g>

  <!-- ================= 2. THE BRAND TYPOGRAPHY ================= -->
  <g id="brand-text">
    <text x="320" y="212" class="stitch-outline logo-text">CodeStitcher</text>
  </g>
</svg>